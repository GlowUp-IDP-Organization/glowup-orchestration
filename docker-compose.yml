version: '3.8'

services:
  # Baza de date principală (Main DB)
  main-db:
    image: postgres:15
    container_name: glowup_main_db
    environment:
      POSTGRES_USER: glowup_user
      POSTGRES_PASSWORD: glowup_password
      POSTGRES_DB: glowup_db
    networks:
      - backend-nw
    ports:
      - "5432:5432"

  # Utilitarul de gestiune a bazei de date
  pgadmin:
    image: dpage/pgadmin4
    container_name: glowup_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@glowup.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    networks:
      - backend-nw
    ports:
      - "5050:80"
    depends_on:
      - main-db

  # Utilitar pentru gestiunea din UI a clusterului
  portainer:
    image: portainer/portainer-ce:latest
    container_name: glowup_portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - backend-nw
    restart: always

  # Sistem de colectare metrici (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: glowup_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend-nw

  # Dashboard pentru observabilitate (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: glowup_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=glowup_grafana
    ports:
      - "3001:3000"
    networks:
      - backend-nw
    depends_on:
      - prometheus

# Definirea rețelelor conform arhitecturii
networks:
  frontend-nw:
  backend-nw:

# Salvarea persistentă a datelor
volumes:
  portainer_data: