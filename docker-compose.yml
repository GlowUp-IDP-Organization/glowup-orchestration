version: '3.8'

services:
  # Baza de date principală (Main DB)
  main-db:
    image: postgres:15
    container_name: glowup_main_db
    environment:
      POSTGRES_USER: glowup_user
      POSTGRES_PASSWORD: glowup_password
      POSTGRES_DB: glowup_db
    networks:
      - backend-nw
    ports:
      - "5433:5432"

  # Utilitarul de gestiune a bazei de date
  pgadmin:
    image: dpage/pgadmin4
    container_name: glowup_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@glowup.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    networks:
      - backend-nw
    ports:
      - "5050:80"
    depends_on:
      - main-db

  # Utilitar pentru gestiunea din UI a clusterului
  portainer:
    image: portainer/portainer-ce:latest
    container_name: glowup_portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - backend-nw
    restart: always

  # Sistem de colectare metrici (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: glowup_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend-nw

  # Dashboard pentru observabilitate (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: glowup_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=glowup_grafana
    ports:
      - "3001:3000"
    networks:
      - backend-nw
    depends_on:
      - prometheus

  # API Gateway
  kong:
    image: kong:latest
    container_name: glowup_kong
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_PROXY_LISTEN=0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    networks:
      - backend-nw
      - frontend-nw

  # Microserviciul de Autentificare
  glowup_auth:
    image: glowup-auth-image:latest
    networks:
      - backend-nw
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure

  # Microserviciul de Logica (Python)
  glowup_logic:
    image: glowup-logic-image:latest
    networks:
      - backend-nw
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure

  # Microserviciul de Date (Node.js)
  glowup_io:
    image: glowup-io-image:latest
    environment:
      - DB_HOST=main-db
      - DB_PORT=5432
      - DB_USER=glowup_user
      - DB_PASSWORD=glowup_password
      - DB_NAME=glowup_db
    networks:
      - backend-nw
    depends_on:
      - main-db
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure

# Definirea rețelelor conform arhitecturii
networks:
  frontend-nw:
  backend-nw:

# Salvarea persistentă a datelor
volumes:
  portainer_data: